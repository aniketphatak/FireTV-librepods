name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the release to (e.g. v0.2.0-alpha)"
        required: true
        default: "v0.2.0-alpha"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Run unit tests
        run: ./gradlew :core:testDebugUnitTest :tv-app:testAppstoreLiteDebugUnitTest --no-daemon --stacktrace

      - name: Assemble appstoreLite (debug-signed for sideload)
        run: ./gradlew :tv-app:assembleAppstoreLiteDebug --no-daemon --stacktrace

      - name: Assemble rootedFull (debug-signed for sideload)
        run: ./gradlew :tv-app:assembleRootedFullDebug --no-daemon --stacktrace

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage APKs with friendly names
        run: |
          mkdir -p release-artifacts
          cp tv-app/build/outputs/apk/appstoreLite/debug/*.apk \
             release-artifacts/podlink-appstoreLite-${{ steps.tag.outputs.name }}.apk
          cp tv-app/build/outputs/apk/rootedFull/debug/*.apk \
             release-artifacts/podlink-rootedFull-${{ steps.tag.outputs.name }}.apk
          ls -la release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: PodLink ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            **Sideload-only debug build for Fire TV.**

            Two flavors are attached:
            - `podlink-appstoreLite-*.apk` — no-root build. Use this on a stock Fire TV.
            - `podlink-rootedFull-*.apk` — rooted-Fire-TV-only build. AAP/L2CAP integration is still a stub at this tag; behavior matches the Lite build until phase 5 lands.

            ## Sideload via Downloader (on your Fire TV)

            1. *Settings → My Fire TV → Developer Options* → enable **Apps from Unknown Sources**.
            2. Open the **Downloader** app.
            3. Paste the URL of the APK from the release assets list. Long URLs work; you can shorten them at tinyurl.com if your remote is uncooperative.
            4. After download, choose **Install**, then **Open**.

            ## What works in this build

            - BLE advertisement scanning for AirPods (manufacturer id `0x4C`).
            - Battery readout (left / right / case) on the home screen.
            - Ear-state detection from BLE adverts.
            - Auto-pause Fire TV media playback when a bud is removed; auto-resume when both buds are back.
            - Routing log line when an A2DP device connects/disconnects.

            ## Permissions PodLink requests

            - `BLUETOOTH_SCAN`, `BLUETOOTH_CONNECT` (Android 12+) — to discover AirPods.
            - `POST_NOTIFICATIONS` — for the foreground-service notification.
            - `MODIFY_AUDIO_SETTINGS` — for the audio routing helper.

            ## Known issues

            - Fire TV has no easy permission UI; if the runtime grant dialog doesn't appear, run `adb shell pm grant dev.podlink.firetv.lite android.permission.BLUETOOTH_SCAN` and friends.
            - Ear-detection latency on the no-root path is 1–3 s (advertisement-bound).
          files: release-artifacts/*.apk
