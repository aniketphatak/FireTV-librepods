name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build :core
        run: ./gradlew :core:assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew :core:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble appstoreLite (debug)
        run: ./gradlew :tv-app:assembleAppstoreLiteDebug --no-daemon --stacktrace

      - name: Assemble rootedFull (debug)
        run: ./gradlew :tv-app:assembleRootedFullDebug --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv-app-debug-apks
          path: tv-app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
